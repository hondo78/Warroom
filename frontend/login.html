<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warroom - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/adminlte-theme.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-body-tertiary">
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card shadow" style="width:360px">
        <div class="card-body p-4">
            <h3 class="text-center mb-1"><span style="color:var(--accent-red,#ef4444);font-weight:700">WAR</span>ROOM</h3>
            <p class="text-center d-block mb-4" style="font-size:.8rem;opacity:.6;text-transform:uppercase;letter-spacing:.08em">Security Operations</p>
            <div id="loginErr" class="alert alert-danger py-2" style="display:none"></div>
            <input id="u" class="form-control mb-2" placeholder="Benutzername / Username" autocomplete="username">
            <input id="p" type="password" class="form-control mb-3" placeholder="Passwort / Password" autocomplete="current-password">
            <button id="btn" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Anmelden</button>
        </div>
    </div>
</div>
<script>
const _params = new URLSearchParams(location.search);
async function submit() {
    const err = document.getElementById('loginErr');
    err.style.display = 'none';
    const btn = document.getElementById('btn'); btn.disabled = true;
    try {
        const r = await fetch('/api/auth/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }),
        });
        if (r.ok) { location.href = _params.get('next') || '/'; return; }
        err.textContent = 'Anmeldung fehlgeschlagen / Login failed';
        err.style.display = 'block';
    } catch (e) {
        err.textContent = 'Fehler / Error: ' + e.message; err.style.display = 'block';
    } finally { btn.disabled = false; }
}
document.getElementById('btn').addEventListener('click', submit);
document.getElementById('p').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
document.getElementById('u').focus();
</script>
</body>
</html>
