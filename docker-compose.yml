services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Docker's default /dev/shm of 64MB is too small for parallel-worker
    # aggregations once firewall_logs grows large (DiskFullError on the
    # /api/map/attacks query at ~14M rows / 41GB).
    shm_size: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-warroom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warroom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    # Allow the backend to reach LMStudio / Ollama / vLLM running on the
    # host machine via http://host.docker.internal:<port>. This is the
    # built-in alias on Docker Desktop and is wired manually on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./geoip:/app/geoip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  syslog:
    build: ./syslog
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warroom}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-warroom}
      REDIS_URL: redis://redis:6379/0
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      SYSLOG_PORT: "5514"
    volumes:
      - ./geoip:/app/geoip
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  netflow:
    build: ./netflow
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-warroom}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-warroom}
      NETFLOW_PORT: "2055"
      BUCKET_INTERVAL: "60"
      RETENTION_DAYS: "30"
    ports:
      - "2055:2055/udp"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8448:80"
    depends_on:
      - backend

  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    environment:
      # Accept the EULA non-interactively and pre-add the Warroom Redis so the
      # UI opens straight onto the cache (no manual "Add database" step).
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST0: "redis"
      RI_REDIS_PORT0: "6379"
      RI_REDIS_ALIAS0: "Warroom Cache"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Anonymous viewer access — no login needed to look at the dashboard.
      # Editing still requires the admin login below.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_DEFAULT_THEME: "dark"
      # Reverse-proxy / subpath support. Empty GRAFANA_ROOT_URL keeps Grafana's
      # native default (direct access on :3030). Behind a proxy under e.g.
      # /grafana set GRAFANA_ROOT_URL=https://host/grafana/ + SERVE_FROM_SUB_PATH=true.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "${GRAFANA_SERVE_FROM_SUB_PATH:-false}"
      # Available to provisioning files as $POSTGRES_USER etc.
      POSTGRES_USER: "${POSTGRES_USER:-warroom}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: "${POSTGRES_DB:-warroom}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data:
  redisinsight_data:
