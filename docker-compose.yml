services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Docker's default /dev/shm of 64MB is too small for parallel-worker
    # aggregations once firewall_logs grows large (DiskFullError on the
    # /api/map/attacks query at ~14M rows / 41GB).
    shm_size: 1g
    # Postgres' out-of-the-box defaults (shared_buffers 128MB, work_mem 4MB)
    # are sized for a toy database. firewall_logs alone is ~113GB / 55M rows,
    # so every dashboard aggregate went to disk and spilled its sorts/hashes to
    # temp files — single queries ran for minutes and exhausted the backend's
    # connection pool. Values stay modest because this host shares its RAM with
    # the local LLM stack.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - random_page_cost=1.1              # SSD, not spinning rust
      - -c
      - effective_io_concurrency=200
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_connections=150
      # Nothing may pin a connection indefinitely — see app/database.py. This is
      # the server-side backstop for clients that set no timeout of their own.
      - -c
      - idle_in_transaction_session_timeout=120000
      - -c
      - track_activity_query_size=4096
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-warroom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warroom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    # Allow the backend to reach LMStudio / Ollama / vLLM running on the
    # host machine via http://host.docker.internal:<port>. This is the
    # built-in alias on Docker Desktop and is wired manually on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./geoip:/app/geoip
      # Persists the secret-encryption key (app/crypto.py) outside the DB. Back up
      # ./data — losing the key makes stored secrets unrecoverable.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  syslog:
    build: ./syslog
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warroom}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-warroom}
      REDIS_URL: redis://redis:6379/0
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      SYSLOG_PORT: "5514"
    volumes:
      - ./geoip:/app/geoip
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  netflow:
    build: ./netflow
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-warroom}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-warroom}
      NETFLOW_PORT: "2055"
      BUCKET_INTERVAL: "60"
      RETENTION_DAYS: "30"
    ports:
      - "2055:2055/udp"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8448:80"
      # Decoy login on its own port: served at the root, nothing else reachable
      # through it. Separate from 8448 so the honeypot can be exposed without
      # exposing the dashboard along with it.
      - "${HONEYPOT_PORT:-8443}:8081"
    depends_on:
      - backend

  redisinsight:
    image: redis/redisinsight:latest
    restart: unless-stopped
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    environment:
      # Accept the EULA non-interactively and pre-add the Warroom Redis so the
      # UI opens straight onto the cache (no manual "Add database" step).
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_REDIS_HOST0: "redis"
      RI_REDIS_PORT0: "6379"
      RI_REDIS_ALIAS0: "Warroom Cache"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    environment:
      # Login for the pgAdmin web UI itself (change the defaults!).
      # Login for the pgAdmin web UI. Use a real TLD — pgAdmin rejects reserved
      # domains like .local at setup. Not used for mail, just the login id.
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:-admin@warroom.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:-changeme_pgadmin}"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"
      # Skip the post-login intro/upgrade nag screens.
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-loads the Warroom DB connection (host/port/db/user). The DB password
      # is entered once on first connect — pgAdmin can save it per-session.
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Anonymous viewer access — no login needed to look at the dashboard.
      # Editing still requires the admin login below.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_DEFAULT_THEME: "dark"
      # Reverse-proxy / subpath support. Empty GRAFANA_ROOT_URL keeps Grafana's
      # native default (direct access on :3030). Behind a proxy under e.g.
      # /grafana set GRAFANA_ROOT_URL=https://host/grafana/ + SERVE_FROM_SUB_PATH=true.
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}"
      GF_SERVER_SERVE_FROM_SUB_PATH: "${GRAFANA_SERVE_FROM_SUB_PATH:-false}"
      # Available to provisioning files as $POSTGRES_USER etc.
      POSTGRES_USER: "${POSTGRES_USER:-warroom}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: "${POSTGRES_DB:-warroom}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  # --- Tor-only Kali box (opt-in: `docker compose --profile kali up -d`) ------
  # The tor gateway forces all of the Kali container's traffic through Tor; Kali
  # exposes only a guarded command API (never a shell) reached by the backend at
  # http://tor:8081. Both are gated behind the `kali` compose profile AND the
  # kali_mcp_enabled feature flag, so nothing runs unless explicitly enabled.
  tor:
    build: ./kali/tor
    profiles: ["kali"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN            # required to install the transparent-proxy iptables

  kali:
    build: ./kali/box
    profiles: ["kali"]
    restart: unless-stopped
    # Share the tor gateway's network namespace → all egress is Tor-only, and
    # the command API is reachable via the tor service name on the warroom net.
    network_mode: "service:tor"
    environment:
      KALI_API_TOKEN: ${KALI_API_TOKEN:-}
      KALI_API_PORT: "8081"
      # The box's own copy of the target allow-list. The backend already sends
      # the operator's list with every request, but a list the caller supplies
      # is a limit the caller can widen; this one it cannot. Leave empty to keep
      # the caller's list as the only check.
      KALI_TARGET_ALLOWLIST: ${KALI_TARGET_ALLOWLIST:-}
    depends_on:
      tor:
        condition: service_started

volumes:
  postgres_data:
  grafana_data:
  redisinsight_data:
  pgadmin_data:
