services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-warroom}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warroom}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./geoip:/app/geoip
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  syslog:
    build: ./syslog
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warroom}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-warroom}
      REDIS_URL: redis://redis:6379/0
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      SYSLOG_PORT: "5514"
    volumes:
      - ./geoip:/app/geoip
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  netflow:
    build: ./netflow
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-warroom}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-warroom}
      NETFLOW_PORT: "2055"
      BUCKET_INTERVAL: "60"
      RETENTION_DAYS: "30"
    ports:
      - "2055:2055/udp"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8448:80"
    depends_on:
      - backend

volumes:
  postgres_data:
